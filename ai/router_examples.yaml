# Labelled example questions for the RAG router (ai/router.py).
#
# Each message is matched to the closest examples by meaning (embeddings); their packs decide which
# tools and prompt sections the agent gets. "none" = no data tools needed (questions about the
# assistant, off-topic, other people's data): the agent still gets the always-on rules and the
# hand-off tool.
#
# Keep these SEPARATE from the evaluation questions (ai/eval_natural.py, ai/cost_bench.py), so the
# routing test measures questions the router has never seen. Mix English and Portuguese, casual
# spelling included, because that is how customers write.

