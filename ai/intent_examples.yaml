# Example questions per intent for the hybrid router (ai/fast_path.py).
#
# Questions matching a local intent clearly are answered on our server without the LLM: the intent's
# tool runs and a reply template is filled from its result. "llm" lists questions that must go to
# the LLM (calculations, follow-ups, actions, hand-offs, several requests at once): having them here
# lets the router recognise those cases instead of guessing.
#
# Keep these SEPARATE from the evaluation questions (ai/eval_natural.py, ai/cost_bench.py) so the
# evaluation measures questions the router has never seen. English and Portuguese, casual spelling.

